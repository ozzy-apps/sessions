name: Build and test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build qt6-base-dev qt6-svg-dev libpulse-dev libasound2-dev libsndfile1
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSESSIONS_BUILD_DEB=OFF
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --parallel 2 --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
          SESSIONS_AUDIO: none
          SESSIONS_NO_UPDATES: '1'
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-libsndfile p7zip
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSESSIONS_BUILD_TESTS=OFF -DSESSIONS_BUILD_DEB=OFF
      - run: cmake --build build --parallel 2
      - run: ./build/sessions.exe --version && ./build/sessions.exe --render build/windows-demo.wav 2
        env:
          QT_QPA_PLATFORM: offscreen
      - run: bash scripts/package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Sessions-windows-x86_64
          path: dist/Sessions-windows-x86_64.zip
