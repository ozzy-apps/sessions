name: Package release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build qt6-base-dev qt6-svg-dev qt6-tools-dev-tools libpulse-dev libasound2-dev libsndfile1 flatpak-builder appstream-compose
      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/check-release.py "$GITHUB_REF_NAME"
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --parallel 2 --output-on-failure
        env: {QT_QPA_PLATFORM: offscreen, SESSIONS_AUDIO: none, SESSIONS_NO_UPDATES: '1'}
      - run: cp dist/sessions_*.deb dist/sessions-linux-amd64.deb
      - run: python3 scripts/fetch-appimage-tools.py build/release-tools
      - run: bash scripts/package-appimage.sh
        env:
          LINUXDEPLOY: build/release-tools/linuxdeploy-x86_64.AppImage
          LINUXDEPLOY_QT: build/release-tools/linuxdeploy-plugin-qt-x86_64.AppImage
      - run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo && flatpak install --user -y flathub org.kde.Platform//6.10 org.kde.Sdk//6.10
      - run: bash scripts/package-flatpak.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Sessions-linux
          path: |
            dist/sessions-linux-amd64.deb
            dist/Sessions-linux-x86_64.AppImage
            dist/Sessions-linux-x86_64.flatpak
  windows:
    runs-on: windows-latest
    defaults:
      run: {shell: 'msys2 {0}'}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-libsndfile p7zip
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSESSIONS_BUILD_TESTS=OFF -DSESSIONS_BUILD_DEB=OFF && cmake --build build --parallel 2
      - run: ./build/sessions.exe --version && ./build/sessions.exe --render build/windows-demo.wav 2
        env: {QT_QPA_PLATFORM: offscreen}
      - run: bash scripts/package-windows.sh
      - uses: actions/upload-artifact@v4
        with: {name: Sessions-windows, path: dist/Sessions-windows-x86_64.zip}
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: release-assets, merge-multiple: true}
      - name: Checksums and draft release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          cd release-assets
          sha256sum *.deb *.AppImage *.flatpak *.zip > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" --json id >/dev/null 2>&1; then
            echo "Release already exists; build artifacts remain available in this workflow run."
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Sessions ${GITHUB_REF_NAME#v}" --notes-file ../distribution/release-notes.md ./*
          fi
